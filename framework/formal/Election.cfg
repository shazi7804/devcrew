\* Safety at 3 concurrent sessions, each opened once, any number of turns.
\* Liveness runs at 2 sessions (ElectionLive.cfg): at 3 the temporal check
\* exceeds a CI budget, and no liveness argument here depends on a third.
CONSTANTS
  Sessions = {s1, s2, s3}
  None = None
SPECIFICATION Spec
INVARIANT TypeOK AtMostOneActing ActingHoldsTop
CHECK_DEADLOCK FALSE
