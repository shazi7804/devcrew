# The deterministic sensors for a change to devcrew itself. They run before
# qa and reviewer judge anything: a red check fails the gate on its own.
name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Neutrality check proves it can fail
        run: python3 tools/check_neutral.py --self-test
      - name: Host- and machine-neutral source (invariant 9)
        run: python3 tools/check_neutral.py
      - name: Live sensor proves it can fail (invariant 10)
        run: python3 framework/tools/check_live.py --self-test
      - name: Formal sensor proves it can fail (R10, R11)
        run: python3 framework/tools/check_formal.py --self-test
      - name: TASKS.md sensor proves it can fail (R4)
        run: python3 framework/tools/check_tasks.py --self-test
      - name: Relative links, role frontmatter, protocol sets = the model's
        run: python3 tools/check_repo.py
      - name: Diagrams aligned and within 80 columns
        run: python3 tools/diagram.py check $(git ls-files '*.md')

  # The framework's own protocols, model-checked (R12), and boot.py checked
  # against its model by trace validation (R13). The broken variants must fail.
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TLA2TOOLS_JAR: ${{ runner.temp }}/tla2tools.jar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: TLC, pinned (tla2tools 1.7.4, sha256 checked by check_models.py)
        run: curl -fsSL -o "$TLA2TOOLS_JAR" https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      - name: Models hold, broken variants fail, boot.py traces match the model
        run: python3 tools/check_models.py
